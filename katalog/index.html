<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Barang</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Katalog Barang</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4">Tambah Barang</h2>
        <form id="formBarang" class="space-y-4">
          <div>
            <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Barang</label>
            <input type="text" id="nama" required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label for="harga" class="block text-sm font-medium text-gray-700 mb-1">Harga</label>
            <input type="number" id="harga" min="0" required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label for="stok" class="block text-sm font-medium text-gray-700 mb-1">Stok</label>
            <input type="number" id="stok" min="0" required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="flex gap-2">
            <button type="submit"
              class="flex-1 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition font-medium">Simpan</button>
            <button type="button" id="hapusSemua"
              class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition font-medium">Hapus Semua</button>
          </div>
        </form>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4">Daftar Barang</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead>
              <tr class="border-b-2 border-gray-200">
                <th class="pb-2 font-semibold text-gray-600">Nama</th>
                <th class="pb-2 font-semibold text-gray-600">Harga</th>
                <th class="pb-2 font-semibold text-gray-600">Stok</th>
                <th class="pb-2 font-semibold text-gray-600">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <p id="emptyMsg" class="text-center text-gray-400 mt-6">Belum ada barang</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Key untuk menyimpan data ke localStorage
    const STORAGE_KEY = 'katalog_barang'

    // Referensi elemen DOM yang sering digunakan
    const form = document.getElementById('formBarang')
    const tbody = document.getElementById('tableBody')
    const emptyMsg = document.getElementById('emptyMsg')
    const hapusSemua = document.getElementById('hapusSemua')

    // Mengambil data barang dari localStorage
    function getData() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')
    }

    // Menyimpan data barang ke localStorage
    function simpanData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data))
    }

    // Merender ulang tabel daftar barang
    function renderTable() {
      const data = getData()
      // Tampilkan pesan kosong jika tidak ada data
      if (data.length === 0) {
        tbody.innerHTML = ''
        emptyMsg.classList.remove('hidden')
        return
      }
      emptyMsg.classList.add('hidden')
      // Generate baris tabel dari array data
      tbody.innerHTML = data.map((item, i) => `
        <tr class="border-b border-gray-100 hover:bg-gray-50">
          <td class="py-2">${item.nama}</td>
          <td class="py-2">Rp ${Number(item.harga).toLocaleString('id-ID')}</td>
          <td class="py-2">${item.stok}</td>
          <td class="py-2">
            <button onclick="hapusItem(${i})" class="text-red-500 hover:text-red-700 text-xs font-medium">Hapus</button>
          </td>
        </tr>
      `).join('')
    }

    // Handler submit form tambah barang
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      const nama = document.getElementById('nama').value.trim()
      const harga = document.getElementById('harga').value
      const stok = document.getElementById('stok').value
      if (!nama || !harga || !stok) return

      const data = getData()
      data.push({ nama, harga: Number(harga), stok: Number(stok) })
      simpanData(data)
      renderTable()
      form.reset()
      document.getElementById('nama').focus()
    })

    // Menghapus satu barang berdasarkan indeks
    window.hapusItem = (index) => {
      const data = getData()
      data.splice(index, 1)
      simpanData(data)
      renderTable()
    }

    // Menghapus semua barang dengan konfirmasi
    hapusSemua.addEventListener('click', () => {
      if (confirm('Hapus semua barang?')) {
        simpanData([])
        renderTable()
      }
    })

    // Inisialisasi: render tabel saat halaman dimuat
    renderTable()
  </script>
</body>
</html>
